name: dast

on:
  push:
    branches: ["mainx"]

env:
  REGISTRY: randres
  IMAGE_NAME: rest_api

jobs:
  dast:
    permissions:
      issues: write

    name: ZAP - DAST Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: Checkout code

      - name: run api
        run: |
          npm install
          npm run dev &
          npx wait-on http://localhost:3000 # IMPROVEMENT: Waits for the API to boot before moving to the ZAP scan

      - name: ZAP Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:3000/search?q=123'